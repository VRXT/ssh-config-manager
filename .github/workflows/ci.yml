name: CI

# Builds and tests every push to main and every pull request.
# The packaged .vsix is kept as a downloadable artifact on the run page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Package extension
        run: npx vsce package --out ssh-config-manager.vsix

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: ssh-config-manager-vsix
          path: ssh-config-manager.vsix
          retention-days: 30
