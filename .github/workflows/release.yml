name: Release

# Runs when you push a version tag, e.g.:
#   npm version patch        (bumps package.json and creates tag v0.4.2)
#   git push --follow-tags
#
# It builds the .vsix, attaches it to a GitHub Release, and publishes it to the
# VS Code Marketplace with trusted publishing (OIDC) — no token or secret needed.
# The Marketplace policy for publisher VRXT must name: repository VRXT/ssh-config-manager,
# workflow release.yml, environment production.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # must match the Marketplace trusted publishing policy
    permissions:
      contents: write # create the GitHub Release
      id-token: write # let vsce request the OIDC token for the Marketplace
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Package extension
        run: npx vsce package --out ssh-config-manager-${GITHUB_REF_NAME#v}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ssh-config-manager-*.vsix
          generate_release_notes: true

      - name: Publish to VS Code Marketplace (trusted publishing)
        run: npx vsce publish --oidc --packagePath ssh-config-manager-${GITHUB_REF_NAME#v}.vsix
